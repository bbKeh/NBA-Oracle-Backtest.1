
name: NBA Oracle - Backtest 5 saisons

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "nba_oracle_backtest.py"
      - "requirements.txt"
      - ".github/workflows/backtest.yml"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Executer le backtest
        run: python nba_oracle_backtest.py

      - name: Publier les rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-oracle-backtest-report
          path: reports/
          if-no-files-found: warn
          retention-days: 30

